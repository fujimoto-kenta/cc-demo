<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TODO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TODO</h1>

    <form id="new-todo-form" class="new-todo">
      <input id="new-todo" type="text" placeholder="やることを入力" aria-label="新しいTODO" autocomplete="off" required>
      <input id="new-todo-due" type="date" aria-label="期限日">
      <button type="submit">追加</button>
    </form>

    <nav class="filters" aria-label="表示の切り替え">
      <button type="button" data-filter="all" aria-pressed="true">すべて</button>
      <button type="button" data-filter="active" aria-pressed="false">未完了</button>
      <button type="button" data-filter="completed" aria-pressed="false">完了</button>
    </nav>

    <ul id="todo-list" class="todo-list" aria-label="TODO一覧"></ul>

    <footer class="footer">
      <span id="todo-count" aria-live="polite"></span>
      <button type="button" id="clear-completed">完了済みを削除</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
